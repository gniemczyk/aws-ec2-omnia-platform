# =============================================================================
# TWORZENIE INFRASTRUKTURY - Omnia Platform
# =============================================================================
# Automatyczne tworzenie EC2 + VPC + sieci przez Terraform.
# Wyzwalane recznie przez workflow_dispatch.
# Pobiera Terraform outputs i zapisuje w AWS SSM Parameter Store.
# Wszystkie wartosci z AWS SSM Parameter Store/Secrets - BRAK hardcode.
# =============================================================================

name: "Utwórz Infrastrukturę"

on:
  workflow_dispatch:

# Wymagane uprawnienia do uwierzytelniania AWS OIDC
permissions:
  id-token: write
  contents: read

jobs:
  create-infrastructure:
    name: "Tworzenie infrastruktury Terraform"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}
      AUTO_APPROVE: true
    outputs:
      instance_id: ${{ steps.terraform-output.outputs.instance_id }}
      vpc_id: ${{ steps.terraform-output.outputs.vpc_id }}
      security_group_id: ${{ steps.terraform-output.outputs.security_group_id }}
      availability_zone: ${{ steps.terraform-output.outputs.availability_zone }}
      iam_role_arn: ${{ steps.terraform-output.outputs.iam_role_arn }}

    steps:
      # =====================================================================
      # KROK 0: Sprawdzenie czy infrastruktura juz istnieje w SSM
      # =====================================================================
      - name: Konfiguracja poswiadczen AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-create-check

      - name: Sprawdzenie istniejącej infrastruktury w SSM
        run: |
          EC2_INSTANCE_ID=$(aws ssm get-parameter --name "/omnia/EC2_INSTANCE_ID" --region ${{ env.AWS_REGION }} --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          
          if [ -n "$EC2_INSTANCE_ID" ] && [ "$EC2_INSTANCE_ID" != "None" ]; then
            echo "::error::Infrastruktura już istnieje!"
            echo "::error::EC2_INSTANCE_ID: $EC2_INSTANCE_ID"
            echo ""
            echo "❌ Tworzenie infrastruktury jest niemożliwe!"
            echo ""
            echo "Aby:"
            echo "  1️⃣  Uruchomić platformę → użyj workflow 'Uruchom Platform'"
            echo "  2️⃣  Zatrzymać platformę → użyj workflow 'Zatrzymaj Platform'"
            echo "  3️⃣  Zniszczyć infrastrukturę → użyj workflow 'Zniszcz Infrastrukturę'"
            echo ""
            echo "Jeśli chcesz zacząć od nowa:"
            echo "  - Najpierw uruchom 'Zniszcz Infrastrukturę'"
            echo "  - SSM Parameters będą skasowane automatycznie"
            echo "  - Wtedy będziesz mógł ponownie tworzyć infrastrukturę"
            exit 1
          else
            echo "✅ Brak istniejącej infrastruktury - można tworzyć"
          fi

      # =====================================================================
      # KROK 1: Pobranie repozytorium
      # =====================================================================
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      # =====================================================================
      # KROK 2: Instalacja Terraform
      # =====================================================================
      - name: Instalacja Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.5.0"

      # =====================================================================
      # KROK 3: Uwierzytelnianie do AWS przez OIDC (dla Terraform)
      # =====================================================================
      - name: Konfiguracja poswiadczen AWS (OIDC) - Terraform
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-create-infrastructure

      # =====================================================================
      # KROK 4: Generowanie SUFFIX z PLATFORM_NAME + Walidacja
      # =====================================================================
      - name: Generowanie SUFFIX i sprawdzenie konfliktu
        id: suffix-gen
        run: |
          PLATFORM_NAME="${{ env.PLATFORM_NAME }}"
          
          # Generowanie SUFFIX z SHA256(PLATFORM_NAME)
          SUFFIX=$(echo -n "$PLATFORM_NAME" | sha256sum | cut -c1-6)
          
          echo "SUFFIX=$SUFFIX" >> $GITHUB_OUTPUT
          echo "BUCKET_NAME=${PLATFORM_NAME}-tfstate-${SUFFIX}" >> $GITHUB_OUTPUT
          echo "TABLE_NAME=${PLATFORM_NAME}-tflock" >> $GITHUB_OUTPUT
          
          # Komunikacja
          echo "📊 Generowanie identyfikatora:"
          echo "  PLATFORM_NAME: $PLATFORM_NAME"
          echo "  SUFFIX (SHA256): $SUFFIX"
          echo "  BUCKET_NAME: ${PLATFORM_NAME}-tfstate-${SUFFIX}"
          echo "  TABLE_NAME: ${PLATFORM_NAME}-tflock"
          
          # ============================================================
          # WALIDACJA: Czy bucket już istnieje?
          # ============================================================
          echo ""
          echo "🔍 Sprawdzenie czy infrastruktura już istnieje..."
          
          BUCKET_EXISTS=$(aws s3 ls "s3://${PLATFORM_NAME}-tfstate-${SUFFIX}" --region ${{ env.AWS_REGION }} 2>&1 || echo "")
          
          if [[ "$BUCKET_EXISTS" == *"NoSuchBucket"* ]] || [[ -z "$BUCKET_EXISTS" ]]; then
            echo "✅ Bucket nie istnieje - można tworzyć infrastrukturę"
          else
            echo "::error::❌ KONFLIKT! Infrastruktura już istnieje!"
            echo "::error::Bucket: ${PLATFORM_NAME}-tfstate-${SUFFIX}"
            echo ""
            echo "::error::Aby kontynuować, wybierz jedną z opcji:"
            echo "::error::1️⃣  Jeśli chcesz zniszczyć istniejącą infrastrukturę:"
            echo "::error::    - Uruchom workflow 'Zniszcz Infrastrukturę'"
            echo "::error::2️⃣  Jeśli chcesz stworzyć nową platformę:"
            echo "::error::    - Zmień PLATFORM_NAME na GitHub Variables"
            echo "::error::    - Nowy PLATFORM_NAME = nowy SUFFIX = nowe resources"
            exit 1
          fi

      # =====================================================================
      # KROK 5: Bootstrap Backend (S3 + DynamoDB)
      # =====================================================================
      - name: Bootstrap Backend
        env:
          BUCKET_NAME: ${{ steps.suffix-gen.outputs.BUCKET_NAME }}
          TABLE_NAME: ${{ steps.suffix-gen.outputs.TABLE_NAME }}
          SUFFIX: ${{ steps.suffix-gen.outputs.SUFFIX }}
        run: |
          echo "📦 Tworzenie zasobów Backend (S3 + DynamoDB)..."
          
          # Utworzenie bucketu S3
          echo ""
          echo "🪣 Tworzenie bucketu S3: $BUCKET_NAME"
          aws s3 mb "s3://$BUCKET_NAME" --region ${{ env.AWS_REGION }}
          
          # Włączenie wersjonowania dla bucket'a
          echo "📝 Włączanie wersjonowania..."
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled \
            --region ${{ env.AWS_REGION }}
          
          # Blokowanie public access (security best practice)
          echo "🔒 Blokowanie public access..."
          aws s3api put-public-access-block \
            --bucket "$BUCKET_NAME" \
            --public-access-block-configuration \
            "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true" \
            --region ${{ env.AWS_REGION }}
          
          # Szyfrowanie domyślne (AES-256)
          echo "🔐 Włączanie szyfrowania..."
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET_NAME" \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                }
              }]
            }' \
            --region ${{ env.AWS_REGION }}

          # Utworzenie tabeli DynamoDB
          echo ""
          echo "🗄️  Tworzenie tabeli DynamoDB: $TABLE_NAME"
          aws dynamodb create-table \
            --table-name "$TABLE_NAME" \
            --attribute-definitions AttributeName=LockID,AttributeType=S \
            --key-schema AttributeName=LockID,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region ${{ env.AWS_REGION }} \
            --tags Key=Project,Value=${{ env.PLATFORM_NAME }} Key=ManagedBy,Value=terraform
          
          echo ""
          echo "✅ Backend resources utworzone pomyślnie!"

      # =====================================================================
      # KROK 6: Terraform init
      # =====================================================================
      - name: Terraform init
        working-directory: terraform
        env:
          BUCKET_NAME: ${{ steps.suffix-gen.outputs.BUCKET_NAME }}
          TABLE_NAME: ${{ steps.suffix-gen.outputs.TABLE_NAME }}
        run: |
          echo "🔧 Inicjalizacja Terraform..."
          terraform init -no-color \
            -backend-config="bucket=$BUCKET_NAME" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      # =====================================================================
      # KROK 7: Terraform validate
      # =====================================================================
      - name: Terraform validate
        working-directory: terraform
        run: |
          echo "✓ Walidacja składni Terraform..."
          terraform validate -no-color

      # =====================================================================
      # KROK 8: Terraform plan
      # =====================================================================
      - name: Terraform plan
        id: plan
        working-directory: terraform
        run: |
          echo "📋 Planowanie zmian..."
          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="project_name=${{ env.PLATFORM_NAME }}" \
            -no-color \
            -out=tfplan

      # =====================================================================
      # KROK 9: Terraform apply (manual approval lub auto)
      # =====================================================================
      - name: Terraform apply
        id: apply
        working-directory: terraform
        run: |
          if [ "${{ env.AUTO_APPROVE }}" == "true" ]; then
            echo "✅ Auto-approve włączony - aplikowanie bez pytania"
            terraform apply -no-color -auto-approve tfplan
          else
            echo "::warning::Czekanie na manualną akceptację workflow"
            terraform apply -no-color tfplan
          fi

      # =====================================================================
      # KROK 10: Pobranie outputow Terraform
      # =====================================================================
      - name: Pobranie Terraform outputow
        id: terraform-output
        working-directory: terraform
        run: |
          echo "📊 Pobieranie Terraform outputs..."
          
          # Pobierz wszystkie outputy w formacie JSON
          OUTPUTS=$(terraform output -json)
          
          # Ekstrahuj wartości z JSON-a za pomocą jq
          INSTANCE_ID=$(echo "$OUTPUTS" | jq -r '.instance_id.value')
          VPC_ID=$(echo "$OUTPUTS" | jq -r '.vpc_id.value')
          SG_ID=$(echo "$OUTPUTS" | jq -r '.security_group_id.value')
          AZ=$(echo "$OUTPUTS" | jq -r '.availability_zone.value')
          IAM_ROLE=$(echo "$OUTPUTS" | jq -r '.iam_role_arn.value')
          
          # Ustawienie output variables bez debug mode
          {
            echo "instance_id=$INSTANCE_ID"
            echo "vpc_id=$VPC_ID"
            echo "security_group_id=$SG_ID"
            echo "availability_zone=$AZ"
            echo "iam_role_arn=$IAM_ROLE"
          } >> $GITHUB_OUTPUT
          
          echo "=== Terraform Outputs ===" 
          echo "Instance ID: $INSTANCE_ID"
          echo "VPC ID: $VPC_ID"
          echo "Security Group: $SG_ID"
          echo "Availability Zone: $AZ"
          echo "IAM Role: $IAM_ROLE"

      # =====================================================================
      # KROK 11: Zapis Terraform outputs do AWS SSM Parameter Store
      # =====================================================================
      - name: Zapis parametrow do AWS SSM
        env:
          SUFFIX: ${{ steps.suffix-gen.outputs.SUFFIX }}
          BUCKET_NAME: ${{ steps.suffix-gen.outputs.BUCKET_NAME }}
        run: |
          INSTANCE_ID="${{ steps.terraform-output.outputs.instance_id }}"
          AWS_REGION="${{ env.AWS_REGION }}"
          PLATFORM_NAME="${{ env.PLATFORM_NAME }}"
          PLATFORM_BASE_DIR="/opt/omnia"
          
          echo "💾 Zapisywanie parametrów do SSM Parameter Store..."
          
          aws ssm put-parameter \
            --name "/omnia/EC2_INSTANCE_ID" \
            --value "$INSTANCE_ID" \
            --type "String" \
            --overwrite \
            --region ${{ env.AWS_REGION }}
          
          aws ssm put-parameter \
            --name "/omnia/AWS_REGION" \
            --value "$AWS_REGION" \
            --type "String" \
            --overwrite \
            --region ${{ env.AWS_REGION }}
          
          aws ssm put-parameter \
            --name "/omnia/PLATFORM_NAME" \
            --value "$PLATFORM_NAME" \
            --type "String" \
            --overwrite \
            --region ${{ env.AWS_REGION }}
          
          aws ssm put-parameter \
            --name "/omnia/PLATFORM_BASE_DIR" \
            --value "$PLATFORM_BASE_DIR" \
            --type "String" \
            --overwrite \
            --region ${{ env.AWS_REGION }}
          
          aws ssm put-parameter \
            --name "/omnia/TFSTATE_BUCKET_SUFFIX" \
            --value "$SUFFIX" \
            --type "String" \
            --overwrite \
            --region ${{ env.AWS_REGION }}
          
          aws ssm put-parameter \
            --name "/omnia/TFSTATE_BUCKET_NAME" \
            --value "$BUCKET_NAME" \
            --type "String" \
            --overwrite \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Parametry zapisane w SSM Parameter Store (${{ env.AWS_REGION }})"

      # =====================================================================
      # KROK 12: Podsumowanie
      # =====================================================================
      - name: Publikacja podsumowania (SUCCESS)
        if: success()
        env:
          BUCKET_NAME: ${{ steps.suffix-gen.outputs.BUCKET_NAME }}
          SUFFIX: ${{ steps.suffix-gen.outputs.SUFFIX }}
        run: |
          echo "## ✅ Infrastruktura gotowa" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Wlasciwosc | Wartosc |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Instance ID | \`${{ steps.terraform-output.outputs.instance_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| AZ | \`${{ steps.terraform-output.outputs.availability_zone }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| VPC | \`${{ steps.terraform-output.outputs.vpc_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Group | \`${{ steps.terraform-output.outputs.security_group_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| S3 Bucket | \`$BUCKET_NAME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SUFFIX | \`$SUFFIX\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## 🔐 Polaczenie przez SSM" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "aws ssm start-session --target ${{ steps.terraform-output.outputs.instance_id }} --region ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## ⚙️ Następne kroki" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Uruchom workflow **'Uruchom Platform'** - będzie używać AWS SSM Parameter Store:" >> $GITHUB_STEP_SUMMARY
          echo "- \`/omnia/EC2_INSTANCE_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`/omnia/AWS_REGION\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`/omnia/PLATFORM_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`/omnia/PLATFORM_BASE_DIR\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 Parametry zostały automatycznie zapisane w SSM Parameter Store"  >> $GITHUB_STEP_SUMMARY

      - name: Publikacja podsumowania (FAILURE)
        if: failure()
        run: |
          echo "## ❌ Błąd podczas tworzenia infrastruktury" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Workflow nie powiódł się. Sprawdź logi powyżej, aby znaleźć przyczynę." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Możliwe przyczyny:" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Infrastruktura już istnieje - zmień PLATFORM_NAME i spróbuj ponownie" >> $GITHUB_STEP_SUMMARY
          echo "- Brakuje AWS_ROLE_ARN w GitHub Secrets" >> $GITHUB_STEP_SUMMARY
          echo "- Brakuje AWS_REGION w GitHub Variables" >> $GITHUB_STEP_SUMMARY
          echo "- Brakuje PLATFORM_NAME w GitHub Variables" >> $GITHUB_STEP_SUMMARY
          echo "- Błędy uprawnień (odczyt z SSM Parameter Store)" >> $GITHUB_STEP_SUMMARY
          echo "- Brak pojemności dla t4g.small w wybranym regionie/AZ" >> $GITHUB_STEP_SUMMARY
