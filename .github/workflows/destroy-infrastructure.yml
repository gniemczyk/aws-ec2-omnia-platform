# =============================================================================
# ZNISZCZENIE INFRASTRUKTURY - Omnia Platform
# =============================================================================
# Automatyczne usunięcie EC2 + VPC + wszystkich zasobów.
# Wyzwalane recznie przez workflow_dispatch.
# OSTRZEZENIE: Ta operacja jest nieodwracalna!
# =============================================================================

name: "Zniszcz Infrastrukturę"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Wpisz 'destroy' aby potwierdzic usunięcie WSZYSTKICH zasobów"
        required: true
        type: string
        default: ""

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  PLATFORM_NAME: ${{ vars.PLATFORM_NAME }}

jobs:
  destroy-infrastructure:
    name: "Zniszczenie infrastruktury Terraform"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # =====================================================================
      # KROK 1: Walidacja potwierdzenia
      # =====================================================================
      - name: Walidacja potwierdzenia
        if: github.event.inputs.confirm != 'destroy'
        run: |
          echo "::error::Wymagane potwierdzenie. Wpisz 'destroy' aby kontynuowac."
          exit 1

      # =====================================================================
      # KROK 2: Ostrzezenie
      # =====================================================================
      - name: Ostrzezenie
        run: |
          echo "::warning::OSTRZEZENIE: Za 10 sekund zostanie uruchomiona operacja niszczenia!"
          echo "::warning::Wszystkie zasoby AWS (EC2, VPC, sieci, storage) zostan usuniete!"
          sleep 10

      # =====================================================================
      # KROK 3: Pobranie repozytorium
      # =====================================================================
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      # =====================================================================
      # KROK 4: Instalacja Terraform
      # =====================================================================
      - name: Instalacja Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ">= 1.5.0"

      # =====================================================================
      # KROK 5: Uwierzytelnianie do AWS przez OIDC
      # =====================================================================
      - name: Konfiguracja poswiadczen AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-destroy-infrastructure

      # =====================================================================
      # KROK 6: Terraform destroy (bez backendu - backend może być po staremu)
      # =====================================================================
      - name: Terraform destroy
        working-directory: terraform
        run: |
          terraform init -no-color -backend=false
          
          terraform destroy \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="project_name=${{ env.PLATFORM_NAME }}" \
            -lock=false \
            -no-color \
            -auto-approve

      # =====================================================================
      # KROK 7: Usunięcie parametrow SSM
      # =====================================================================
      - name: Usunięcie parametrow SSM
        run: |
          echo "Usuwanie parametrow SSM Parameter Store..."
          
          aws ssm delete-parameter --name "/omnia/EC2_INSTANCE_ID" --region us-east-1 2>/dev/null || echo "Parameter /omnia/EC2_INSTANCE_ID nie istnieje"
          aws ssm delete-parameter --name "/omnia/AWS_REGION" --region us-east-1 2>/dev/null || echo "Parameter /omnia/AWS_REGION nie istnieje"
          aws ssm delete-parameter --name "/omnia/PLATFORM_NAME" --region us-east-1 2>/dev/null || echo "Parameter /omnia/PLATFORM_NAME nie istnieje"
          aws ssm delete-parameter --name "/omnia/PLATFORM_BASE_DIR" --region us-east-1 2>/dev/null || echo "Parameter /omnia/PLATFORM_BASE_DIR nie istnieje"
          
          echo "✅ Parametry SSM skasowane"

      # =====================================================================
      # KROK 8: Cleanup Backend - czyść OBIE nazwy (starą + nową)
      # =====================================================================
      - name: Cleanup Backend - czyść S3 + DynamoDB
        run: |
          # Nowe nazwy (po refactoringu)
          NEW_BUCKET="${{ env.PLATFORM_NAME }}-tfstate"
          NEW_TABLE="${{ env.PLATFORM_NAME }}-tflock"
          
          # Stare nazwy (przed refactoringiem)
          OLD_BUCKET="${{ env.PLATFORM_NAME }}-tf-state-${{ github.repository_owner }}"
          OLD_TABLE="${{ env.PLATFORM_NAME }}-tf-locks"
          
          echo "Czyszczenie S3 i DynamoDB..."
          
          # Czyść nowe zasoby
          for BUCKET in "$NEW_BUCKET" "$OLD_BUCKET"; do
            echo "Czyszczenie bucketu: $BUCKET"
            aws s3api list-object-versions --bucket "$BUCKET" --region ${{ env.AWS_REGION }} \
              --query 'Versions[*].[Key,VersionId]' --output text 2>/dev/null | \
              while read key versionid; do
                if [ ! -z "$key" ]; then
                  aws s3api delete-object --bucket "$BUCKET" --key "$key" --version-id "$versionid" --region ${{ env.AWS_REGION }} 2>/dev/null || true
                fi
              done
            
            # Usuń delete markers
            aws s3api list-object-versions --bucket "$BUCKET" --region ${{ env.AWS_REGION }} \
              --query 'DeleteMarkers[*].[Key,VersionId]' --output text 2>/dev/null | \
              while read key versionid; do
                if [ ! -z "$key" ]; then
                  aws s3api delete-object --bucket "$BUCKET" --key "$key" --version-id "$versionid" --region ${{ env.AWS_REGION }} 2>/dev/null || true
                fi
              done
            
            # Usuń bucket
            aws s3 rb "s3://$BUCKET" --force --region ${{ env.AWS_REGION }} 2>/dev/null || echo "  Bucket $BUCKET juz usuniety"
          done
          
          # Czyść obie tabele DynamoDB
          for TABLE in "$NEW_TABLE" "$OLD_TABLE"; do
            echo "Czyszczenie tabeli DynamoDB: $TABLE"
            aws dynamodb delete-table --table-name "$TABLE" --region ${{ env.AWS_REGION }} 2>/dev/null || echo "  Tabela $TABLE juz usunieta"
          done
          
          echo "✅ Backend cleanup kompletny (obie nazwy)"

      # =====================================================================
      # KROK 9: Czyszczenie GitHub Variables (opcjonalnie)
      # =====================================================================
      - name: Czyszczenie GitHub Variables
        run: |
          echo "::notice::GitHub Variables nie zostaly automatycznie usuniete."
          echo "::notice::Mozesz je manualnie usunac w Settings > Variables and secrets > Actions"

      # =====================================================================
      # KROK 10: Podsumowanie
      # =====================================================================
      - name: Publikacja potwierdzenia zniszczenia
        if: always()
        run: |
          echo "## ⚠️ Infrastruktura zniszczona" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Status | Wartosc |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Akcja | Usunięcie infrastruktury |" >> $GITHUB_STEP_SUMMARY
          echo "| Region | \`${{ env.AWS_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Wykonal | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Czas | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Co zostalo usunięte:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Instancja EC2" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ VPC i Subnety" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security Groups" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ IAM Role i Instance Profile" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ VPC Endpoints" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ EBS Volumes" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SSM Parameters" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **GitHub Variables trzeba usunac manualnie** w Settings > Variables and secrets > Actions" >> $GITHUB_STEP_SUMMARY
