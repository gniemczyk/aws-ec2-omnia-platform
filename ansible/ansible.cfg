# =============================================================================
# Konfiguracja Ansible - Omnia Platform
# =============================================================================
# Polaczenie: AWS SSM (brak SSH, brak kluczy, brak otwartych portow)
# Wszystkie wartosci pobierane ze zmiennych srodowiskowych lub group_vars.
# =============================================================================

[defaults]
deprecation_warnings = False
inventory = inventory.yml
remote_tmp = /tmp/.ansible/tmp
local_tmp = /tmp/.ansible/local
host_key_checking = False
retry_files_enabled = False
gathering = explicit
stdout_callback = default
callback_result_format = yaml
timeout = 300
command_timeout = 600
ssh_connection_timeout = 60

vars_plugins_enabled = host_group_vars

[connection]
# pipelining = True powoduje Connection.__del__ w aws_ssm (GC race condition)
pipelining = False

[ssh_connection]
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
control_master = auto
control_persist = 600
ssh_args = -o ControlMaster=auto -o ControlPersist=600 -o ConnectTimeout=60 -o ServerAliveInterval=30 -o ServerAliveCountMax=3

[aws_ssm]
command_timeout = 600
timeout = 300
