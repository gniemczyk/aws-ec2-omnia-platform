# =============================================================================
# Konfiguracja Ansible - Omnia Platform
# =============================================================================
# Polaczenie: AWS SSM (brak SSH, brak kluczy, brak otwartych portow)
# Wszystkie wartosci pobierane ze zmiennych srodowiskowych lub group_vars.
# =============================================================================

[defaults]
inventory = inventory.yml
remote_tmp = /tmp/.ansible/tmp
local_tmp = /tmp/.ansible/local
host_key_checking = False
retry_files_enabled = False
gathering = explicit
stdout_callback = yaml
timeout = 60

# Polaczenie SSM wymaga dluzszych timeoutow z powodu narzutu tunelu
command_timeout = 120

# Zmienne grupowe
vars_plugins_enabled = host_group_vars

[connection]
pipelining = True

[ssh_connection]
# SSH NIE jest uzywane - ta sekcja jest celowo pusta
