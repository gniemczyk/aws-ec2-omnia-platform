# =============================================================================
# Grafana - zmienne specificzne dla aplikacji
# =============================================================================
# Wartosci z Jinja2 sa ewaluowane podczas deployu.
# Zmienne (grafana_admin_user, grafana_admin_password) pochodza z:
#   - --extra-vars (GitHub Secrets) lub
#   - domyslnych wartosci z playbook.yml (losowe haslo)
# =============================================================================

env_extra:
  GF_SECURITY_ADMIN_USER: "{{ grafana_admin_user }}"
  GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
  AWS_USE_DUALSTACK_ENDPOINT: "true"
  # Region dla AWS SDK w kontenerze Grafana - pochodzi ze zmiennej playbooka.
  # Kaskada: --extra-vars > AWS_REGION env > domyslny z playbook.yml.
  AWS_DEFAULT_REGION: "{{ aws_region }}"
