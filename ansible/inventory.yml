# =============================================================================
# Inventory Ansible - Polaczenie SSM (bez SSH)
# =============================================================================
# Wszystkie wartosci sa pobierane ze zmiennych srodowiskowych.
# Brak hardcode - kazda wartosc jest parametryzowana.
# =============================================================================

all:
  vars:
    # Zmienne platformy - nadpisywane przez env lub extra-vars
    platform_name: "{{ lookup('env', 'PLATFORM_NAME') | default('omnia-platform', true) }}"
    platform_base_dir: "{{ lookup('env', 'PLATFORM_BASE_DIR') | default('/opt/omnia', true) }}"
    apps_config_filename: "{{ lookup('env', 'APPS_CONFIG_FILE') | default('apps.json', true) }}"
    cloudflared_bin: "{{ lookup('env', 'CLOUDFLARED_BIN') | default('/usr/local/bin/cloudflared', true) }}"
    tunnel_log_dir: "{{ lookup('env', 'TUNNEL_LOG_DIR') | default('/tmp/tunnels', true) }}"
    tunnel_wait_seconds: "{{ lookup('env', 'TUNNEL_WAIT_SECONDS') | default('20', true) | int }}"

  hosts:
    omnia_instance:
      # ID instancji - wstrzykiwane z GitHub Actions lub Terraform output
      ansible_host: "{{ lookup('env', 'EC2_INSTANCE_ID') }}"

      # Polaczenie SSM - BEZ SSH, BEZ kluczy, BEZ otwartych portow
      ansible_connection: community.aws.aws_ssm

      # Region AWS - ze zmiennej srodowiskowej
      ansible_aws_ssm_region: "{{ lookup('env', 'AWS_REGION') }}"

      # Sciezka do pluginu Session Manager
      ansible_aws_ssm_plugin: "{{ lookup('env', 'SSM_PLUGIN_PATH') | default('/usr/local/sessionmanagerplugin/bin/session-manager-plugin', true) }}"

      # Bucket S3 dla wyjscia sesji SSM - wymagany przez aws_ssm connection plugin,
      # ktory w niektorych wersjach crashuje z NoneType gdy bucket nie jest podany
      ansible_aws_ssm_bucket_name: "{{ lookup('env', 'SSM_S3_BUCKET_NAME') }}"

      # Interpreter Python na Debian
      ansible_python_interpreter: /usr/bin/python3
