# =============================================================================
# Omnia Platform - Glowny Playbook
# =============================================================================
# Laczy sie przez AWS SSM (bez SSH). Wdraza kontenery Docker na podstawie:
#   - apps.json (definicja aplikacji)
#   - app/<name>/ (Dockerfile + docker-compose.yml)
#   - ansible/apps/<name>.yml (extra env vars per aplikacja)
# Eksponuje uslugi przez Cloudflare Quick Tunnels (trycloudflare.com).
# =============================================================================

---
- name: Wdrozenie Omnia Platform
  hosts: omnia_instance
  become: true
  gather_facts: true

  vars:
    # Sciezki
    apps_config_path: "{{ platform_base_dir }}/{{ apps_config_filename }}"
    apps_dir: "{{ platform_base_dir }}/app"
    results_file: "{{ platform_base_dir }}/tunnel-urls.md"

    # Prefiks dla SSM Parameter Store (np. /nazwa-platformy/)
    ssm_root: "/{{ platform_name }}"

    # Dane logowania do Grafany - nadpisywane przez --extra-vars (z GitHub Secrets)
    # Pobierane z SSM przez GitHub Actions
    grafana_admin_user: admin
    grafana_admin_password: ""

    # Region AWS - nadpisywany przez --extra-vars lub zmienna srodowiskowa AWS_REGION
    # Uzywany w cloudwatch-agent.yml do URL i konfiguracji agenta
    aws_region: "{{ lookup('env', 'AWS_REGION') | default('eu-central-1', true) }}"

  tasks:
    # =========================================================================
    # FAZA 0: Generowanie brakujacych sekretow (przed zaladowaniem per-app vars)
    # =========================================================================

    - name: Przywrocenie domyslnego uzytkownika admina jesli przekazano pusty
      set_fact:
        grafana_admin_user: admin
      when: grafana_admin_user | length == 0

    - name: FAZA 0b - Zarzadzanie haslem Grafana
      ansible.builtin.debug:
        msg: "Hasło i użytkownik Grafana zostały przekazane przez extra-vars."

    # =========================================================================
    # Import faz
    # =========================================================================

    - name: FAZA 1a - Oczekiwanie na gotowosc instancji (cloud-init)
      command: cloud-init status --wait
      changed_when: false
      # timeout: 300 nie dziala w module command, wiec po prostu zablokuje wykonanie do zakonczenia.

    - name: FAZA 1b - Instalacja i konfiguracja Cloudflare WARP (Dostep IPv4 do Internetu)
      ansible.builtin.import_tasks: tasks/warp.yml

    - name: FAZA 2 - Przygotowanie systemu (Docker, glowne pakiety)
      ansible.builtin.import_tasks: tasks/system.yml

    - name: FAZA 2b - Instalacja CloudWatch Agent (logi kontenera)
      ansible.builtin.import_tasks: tasks/cloudwatch-agent.yml
      when: cloudwatch_agent_install | default(true)

    - name: FAZA 3 - Instalacja cloudflared
      ansible.builtin.import_tasks: tasks/cloudflared.yml

    - name: FAZA 4 - Konfiguracja aplikacji
      ansible.builtin.import_tasks: tasks/config.yml

    - name: FAZA 5 - Deploy kontenerow
      ansible.builtin.import_tasks: tasks/deploy.yml

    - name: FAZA 6 - Tunele Cloudflare
      ansible.builtin.import_tasks: tasks/tunnels.yml

    - name: FAZA 7 - Raport
      ansible.builtin.import_tasks: tasks/report.yml
