# =============================================================================
# Omnia Platform - Glowny Playbook
# =============================================================================
# Laczy sie przez AWS SSM (bez SSH). Wdraza kontenery Docker na podstawie:
#   - apps.json (definicja aplikacji)
#   - app/<name>/ (Dockerfile + docker-compose.yml)
#   - ansible/apps/<name>.yml (extra env vars per aplikacja)
# Eksponuje uslugi przez Cloudflare Quick Tunnels (trycloudflare.com).
# =============================================================================

---
- name: Wdrozenie Omnia Platform
  hosts: omnia_instance
  become: true
  gather_facts: true

  vars:
    # Sciezki
    apps_config_path: "{{ platform_base_dir }}/{{ apps_config_filename }}"
    apps_dir: "{{ platform_base_dir }}/app"
    results_file: "{{ platform_base_dir }}/tunnel-urls.md"

    # Dane logowania do Grafany - nadpisywane przez --extra-vars (z GitHub Secrets)
    # Jesli nie podane, zostanie wygenerowane losowe haslo podczas deployu
    grafana_admin_user: admin
    grafana_admin_password: ""

  tasks:
    # =========================================================================
    # FAZA 0: Generowanie brakujacych sekretow (przed zaladowaniem per-app vars)
    # =========================================================================

    - name: Przywrocenie domyslnego uzytkownika admina jesli przekazano pusty
      set_fact:
        grafana_admin_user: admin
      when: grafana_admin_user | length == 0

    - name: Generowanie losowego hasla admina Grafany
      set_fact:
        grafana_admin_password: "{{ lookup('pipe', 'openssl rand -hex 12') }}"
      when: grafana_admin_password | length == 0
      no_log: true

    # =========================================================================
    # Import faz
    # =========================================================================

    - name: FAZA 1 - Przygotowanie systemu
      ansible.builtin.import_tasks: tasks/system.yml

    - name: FAZA 2 - Instalacja cloudflared
      ansible.builtin.import_tasks: tasks/cloudflared.yml

    - name: FAZA 3 - Konfiguracja aplikacji
      ansible.builtin.import_tasks: tasks/config.yml

    - name: FAZA 4 - Deploy kontenerow
      ansible.builtin.import_tasks: tasks/deploy.yml

    - name: FAZA 5 - Tunele Cloudflare
      ansible.builtin.import_tasks: tasks/tunnels.yml

    - name: FAZA 6 - Raport
      ansible.builtin.import_tasks: tasks/report.yml
