  # 'expected string or bytes-like object, got NoneType' podczas Gathering Facts
  # (regresja w 7.x/8.x, naprawione w 9.2.0)
  - name: community.aws
    version: ">=9.2.0,<10.0.0"
  - name: amazon.aws
    version: ">=9.2.0,<10.0.0"
  - name: community.docker
    version: ">=3.0.0"
