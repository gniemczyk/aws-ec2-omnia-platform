# Wymagania Ansible Galaxy
# Instalacja: ansible-galaxy collection install -r requirements.yml
---
collections:
  # Szeroki zakres wersji - bucket S3 jest przekazywany jawnie do aws_ssm
  # przez ansible_aws_ssm_bucket_name, co omija bug z NoneType
  - name: community.aws
    version: ">=7.0.0,<10.0.0"
  - name: amazon.aws
    version: ">=7.0.0,<10.0.0"
  - name: community.docker
    version: ">=3.0.0"
