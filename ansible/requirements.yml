# Wymagania Ansible Galaxy
# Instalacja: ansible-galaxy collection install -r requirements.yml
---
collections:
  # Pinning do 7.x/8.x - aws_ssm w 9.x+ ma regresje:
  # 'expected string or bytes-like object, got NoneType' podczas Gathering Facts
  - name: community.aws
    version: ">=7.0.0,<9.0.0"
  - name: amazon.aws
    version: ">=7.0.0,<9.0.0"
  - name: community.docker
    version: ">=3.0.0"
