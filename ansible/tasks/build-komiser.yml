# =============================================================================
# Build Komiser obrazu lokalnie na EC2 (ARM64 native build)
# =============================================================================
# Zamiast cross-compile na x86_64 GitHub Runner, budujemy bezpośrednio na EC2
# gdzie jest native ARM64 architektura.
# To gwarantuje poprawne binaries bez "exec format error".
# =============================================================================

- name: Sprawdzenie czy Komiser jest w apps.json
  set_fact:
    komiser_enabled: "{{ apps | map(attribute='name') | select('equalto', 'komiser') | list | length > 0 }}"

- name: Build Komiser (ARM64 native) na EC2
  block:
    - name: Sprawdzenie czy Dockerfile Komisera istnieje
      stat:
        path: "{{ apps_dir }}/komiser/Dockerfile"
      register: komiser_dockerfile

    - name: Build image Komiser bezpośrednio na EC2
      shell: |
        set -euo pipefail
        echo "🔨 Build obrazu Komiser na EC2 (native ARM64)..."
        cd {{ apps_dir }}/komiser
        
        # Ustal architekturę EC2
        ARCH=$(uname -m)
        case "$ARCH" in
          aarch64) TARGETARCH="arm64" ;;
          x86_64) TARGETARCH="amd64" ;;
          *) TARGETARCH="$ARCH" ;;
        esac
        
        docker build \
          --tag tailwarden/komiser:3.1.22 \
          --build-arg TARGETARCH=$TARGETARCH \
          -f Dockerfile \
          .
        echo "✅ Obraz Komiser zbudowany"
      when: komiser_dockerfile.stat.exists
      register: komiser_build_result
      
    - name: Weryfikacja architektury Komisera
      shell: |
        ARCH=$(docker inspect tailwarden/komiser:3.1.22 --format '{{.Architecture}}' 2>/dev/null || echo "unknown")
        echo "Architektura obrazu: $ARCH"
        if [ "$ARCH" != "arm64" ]; then
          echo "❌ BŁĄD: $ARCH (oczekiwano arm64)"
          exit 1
        fi
      register: komiser_arch_check
      when: komiser_dockerfile.stat.exists and komiser_build_result is defined
      
    - name: Potwierdzenie - Komiser gotowy
      debug:
        msg: "✅ Komiser: ARM64 native build OK"
      when: komiser_arch_check is succeeded

  when: komiser_enabled
  rescue:
    - name: "⚠️ Build Komiser nie powiódł się - fallback"
      debug:
        msg: "Build Komiser falied. Deployment spróbuje pobrać z Docker Hub."
