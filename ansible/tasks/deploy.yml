# =============================================================================
# FAZA 4: Uruchomienie kontenerow Docker
# =============================================================================
# Dla kazdej aplikacji z apps.json:
#   1. Zatrzymaj stare kontenery platformy
#   2. Generuj .env (z apps.json + per-app env_extra)
#   3. docker compose up (compose=true) lub docker run (compose=false)
# =============================================================================

- name: Sprawdzenie istniejacych kontenerow platformy
  shell: docker ps -a --filter "label=platform=omnia" -q
  register: existing_containers
  changed_when: false

- name: Zatrzymanie istniejacych kontenerow platformy
  shell: |
    docker ps -a --filter "label=platform=omnia" -q | xargs -r docker rm -f
  when: existing_containers.stdout | length > 0
  changed_when: true

- name: Generowanie pliku .env dla kazdej aplikacji (compose)
  copy:
    content: |
      # Wygenerowane automatycznie przez Ansible - nie edytowac recznie
      APP_PORT={{ item.port }}
      AWS_DEFAULT_REGION={{ lookup('env', 'AWS_REGION') }}
      AWS_REGION={{ lookup('env', 'AWS_REGION') }}
      # Nie przekazujemy tymczasowych credentials GitHub Actions na EC2.
      # Aplikacje AWS korzystaja z minimalnej roli przypisanej do instancji (IMDSv2).
      {% for env_var in item.env | default([]) %}
      {{ env_var }}
      {% endfor %}
      {% set app_var_key = 'app_' + item.name %}
      {% set app_vars = vars[app_var_key] | default({}) %}
      {% if app_vars is mapping and app_vars.env_extra is defined %}
      {% for key, value in app_vars.env_extra.items() %}
      {{ key }}={{ value }}
      {% endfor %}
      {% endif %}
    dest: "{{ apps_dir }}/{{ item.name }}/.env"
    mode: "0600"
  loop: "{{ apps }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.compose | default(false)

- name: Generowanie pliku aws-config dla Komiser
  copy:
    content: |
      [default]
      region = {{ lookup('env', 'AWS_REGION') }}
      output = json
    dest: "{{ apps_dir }}/komiser/aws-config"
    mode: "0644"
  when: apps | selectattr('name', 'equalto', 'komiser') | list | length > 0



- name: Usuwanie starych obrazow komiser jesli maja zla architekture
  shell: |
    TAG="tailwarden/komiser:3.1.22"
    EXISTING=$(docker inspect "$TAG" --format '{% raw %}{{.Architecture}}{% endraw %}' 2>/dev/null || echo "missing")
    if [ "$EXISTING" != "arm64" ] && [ "$EXISTING" != "missing" ]; then
      echo "Usuwanie obrazu $TAG (architektura: $EXISTING)"
      docker image rm "$TAG" 2>/dev/null || true
    fi
  changed_when: false
  when: apps | selectattr('name', 'equalto', 'komiser') | list | length > 0

- name: Wczytanie pre-built obrazow z S3 (jesli istnieja)
  shell: |
    set -euo pipefail
    S3_FILE="s3://{{ lookup('env', 'SSM_S3_BUCKET_NAME') }}/images/{{ item.name }}.tar.gz"
    if aws s3 cp "$S3_FILE" /tmp/{{ item.name }}-image.tar.gz 2>/dev/null; then
      gunzip -f /tmp/{{ item.name }}-image.tar.gz
      LOAD_OUTPUT=$(docker load -i /tmp/{{ item.name }}-image.tar 2>&1)
      rm -f /tmp/{{ item.name }}-image.tar
      echo "$LOAD_OUTPUT"
      # Wyodrebnij tag obrazu z outputu docker load
      LOADED_TAG=$(echo "$LOAD_OUTPUT" | sed -n 's/^Loaded image: //p' | head -1)
      if [ -n "$LOADED_TAG" ]; then
        ARCH=$(docker inspect "$LOADED_TAG" --format '{% raw %}{{.Architecture}}{% endraw %}' 2>/dev/null || echo "unknown")
        if [ "$ARCH" != "arm64" ]; then
          echo "UWAGA: Obraz $LOADED_TAG ma architekture $ARCH (oczekiwano arm64). Usuwanie."
          docker image rm "$LOADED_TAG" 2>/dev/null || true
        else
          echo "OK: Obraz $LOADED_TAG zaladowany z S3 (architektura: $ARCH)"
        fi
      fi
    else
      echo "INFO: Brak pre-built obrazu w S3 dla {{ item.name }}. Docker Compose pobierze z Docker Hub."
    fi
  loop: "{{ apps }}"
  loop_control:
    label: "{{ item.name }} (image load)"
  when: item.compose | default(false)
  changed_when: true

- name: Wdrozenie aplikacji przez docker compose (jesli compose=true)
  shell: |
    cd {{ apps_dir }}/{{ item.name }}
    docker compose down --remove-orphans 2>/dev/null || true
    docker compose up -d
  loop: "{{ apps }}"
  loop_control:
    label: "{{ item.name }} (docker compose)"
  when: item.compose | default(false)
  register: compose_results
  timeout: 1200  # 20 minut dla build (Komiser npm + go build)

- name: Wdrozenie aplikacji przez docker run (jesli compose=false)
  shell: |
    docker rm -f "omnia-{{ item.name }}" 2>/dev/null || true
    ENV_FLAGS=()
    {% for env_var in item.env | default([]) %}
    ENV_FLAGS+=(-e "{{ env_var }}")
    {% endfor %}
    {% set app_var_key = 'app_' + item.name %}
    {% set app_vars = vars[app_var_key] | default({}) %}
    {% if app_vars is mapping and app_vars.env_extra is defined %}
    {% for key, value in app_vars.env_extra.items() %}
    ENV_FLAGS+=(-e "{{ key }}={{ value }}")
    {% endfor %}
    {% endif %}
    docker run -d \
      --name "omnia-{{ item.name }}" \
      --restart unless-stopped \
      --label "platform=omnia" \
      -p "127.0.0.1:{{ item.port }}:{{ item.port }}" \
      "${ENV_FLAGS[@]}" \
      "{{ item.image }}"
  args:
    executable: /bin/bash
  loop: "{{ apps }}"
  loop_control:
    label: "{{ item.name }} (docker run)"
  when: not (item.compose | default(false))
  register: run_results

- name: Oczekiwanie na gotowosc kontenerow
  pause:
    seconds: 10

- name: Weryfikacja dzialajacych kontenerow
  shell: docker ps --filter "label=platform=omnia" --format "table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}"
  changed_when: false
  register: docker_ps_output

- name: Wyswietlenie dzialajacych kontenerow
  debug:
    msg: "{{ docker_ps_output.stdout_lines }}"
