# =============================================================================
# FAZA 4: Uruchomienie kontenerow Docker
# =============================================================================
# Dla kazdej aplikacji z apps.json:
#   1. Zatrzymaj stare kontenery platformy
#   2. Generuj .env (z apps.json + per-app env_extra)
#   3. docker compose up (compose=true) lub docker run (compose=false)
# =============================================================================

- name: Sprawdzenie istniejacych kontenerow platformy
  shell: docker ps -a --filter "label=platform=omnia" -q
  register: existing_containers
  changed_when: false

- name: Zatrzymanie istniejacych kontenerow platformy
  shell: |
    docker ps -a --filter "label=platform=omnia" -q | xargs -r docker rm -f
  when: existing_containers.stdout | length > 0
  changed_when: true

- name: Generowanie pliku .env dla kazdej aplikacji (compose)
  copy:
    content: |
      # Wygenerowane automatycznie przez Ansible - nie edytowac recznie
      APP_PORT={{ item.port }}
      {% for env_var in item.env | default([]) %}
      {{ env_var }}
      {% endfor %}
      {% set app_vars = vars.get('app_' + item.name, {}) %}
      {% if app_vars is mapping and app_vars.env_extra is defined %}
      {% for key, value in app_vars.env_extra.items() %}
      {{ key }}={{ value }}
      {% endfor %}
      {% endif %}
    dest: "{{ apps_dir }}/{{ item.name }}/.env"
    mode: "0600"
  loop: "{{ apps }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.compose | default(false)

- name: Wdrozenie aplikacji przez docker compose (jesli compose=true)
  shell: |
    cd {{ apps_dir }}/{{ item.name }}
    docker compose down --remove-orphans 2>/dev/null || true
    docker compose up -d --build
  loop: "{{ apps }}"
  loop_control:
    label: "{{ item.name }} (docker compose)"
  when: item.compose | default(false)
  register: compose_results

- name: Wdrozenie aplikacji przez docker run (jesli compose=false)
  shell: |
    docker rm -f "omnia-{{ item.name }}" 2>/dev/null || true
    ENV_FLAGS=()
    {% for env_var in item.env | default([]) %}
    ENV_FLAGS+=(-e "{{ env_var }}")
    {% endfor %}
    {% set app_vars = vars.get('app_' + item.name, {}) %}
    {% if app_vars is mapping and app_vars.env_extra is defined %}
    {% for key, value in app_vars.env_extra.items() %}
    ENV_FLAGS+=(-e "{{ key }}={{ value }}")
    {% endfor %}
    {% endif %}
    docker run -d \
      --name "omnia-{{ item.name }}" \
      --restart unless-stopped \
      --label "platform=omnia" \
      -p "127.0.0.1:{{ item.port }}:{{ item.port }}" \
      "${ENV_FLAGS[@]}" \
      "{{ item.image }}"
  args:
    executable: /bin/bash
  loop: "{{ apps }}"
  loop_control:
    label: "{{ item.name }} (docker run)"
  when: not (item.compose | default(false))
  register: run_results

- name: Oczekiwanie na gotowosc kontenerow
  pause:
    seconds: 10

- name: Weryfikacja dzialajacych kontenerow
  shell: docker ps --filter "label=platform=omnia" --format "table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}"
  changed_when: false
  register: docker_ps_output

- name: Wyswietlenie dzialajacych kontenerow
  debug:
    msg: "{{ docker_ps_output.stdout_lines }}"
