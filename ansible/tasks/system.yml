# =============================================================================
# FAZA 1: Przygotowanie systemu
# =============================================================================

- name: Aktualizacja cache apt
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Instalacja wymaganych pakietow systemowych
  apt:
    name:
      - docker.io
      - docker-compose
      - jq
      - curl
      - ca-certificates
    state: present

- name: Uruchomienie i wlaczenie uslugi Docker
  systemd:
    name: docker
    state: started
    enabled: true
