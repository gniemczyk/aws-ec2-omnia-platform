# =============================================================================
# FAZA 6: Cloudflare Quick Tunnels (nohup)
# =============================================================================
# Uruchamia cloudflared w tle (nohup) dla kazdej aplikacji.
# Logi: {{ tunnel_log_dir }}/{{ app_name }}.log
# =============================================================================

- name: Utworzenie katalogu logow tuneli
  file:
    path: "{{ tunnel_log_dir }}"
    state: directory
    mode: "0755"

- name: Zakonczenie istniejacych procesow cloudflared
  shell: "pkill -f '[c]loudflared' || true"
  changed_when: false

- name: Uruchomienie Cloudflare Quick Tunnel dla kazdej aplikacji
  shell: |
    nohup {{ cloudflared_bin }} tunnel --url http://localhost:{{ item.port }} --no-autoupdate \
      > {{ tunnel_log_dir }}/{{ item.name }}.log 2>&1 &
    echo $!
  loop: "{{ apps }}"
  loop_control:
    label: "{{ item.name }} -> localhost:{{ item.port }}"
  register: tunnel_pids
  changed_when: true
