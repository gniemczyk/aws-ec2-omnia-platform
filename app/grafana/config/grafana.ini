# =============================================================================
# Grafana - Konfiguracja (grafana.ini)
# =============================================================================
# Ten plik jest kopiowany do kontenera przez Dockerfile i nadpisywany przez
# zmienne srodowiskowe GF_* w docker-compose.yml / Ansible.
# =============================================================================

[log]
# Poziom logowania: debug - pelny wglad w requesty/response CloudWatch plugin
# i AWS SDK. Zmiana na info po zakonczeniu debugowania.
level = debug

# Filtry per-komponent:
#   cloudwatch:debug - logi CloudWatch datasource plugin (kwerendy, response)
#   aws:debug       - logi AWS SDK (requesty HTTP, autoryzacja, retries)
filters = cloudwatch:debug,aws:debug
