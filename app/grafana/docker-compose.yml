# =============================================================================
# Grafana - Docker Compose
# =============================================================================
# Lokalnie:  cp .env.example .env -> docker-compose up
# Produkcja: .env generowany automatycznie przez Ansible (apps.json + Secrets)
# =============================================================================

services:
  grafana:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omnia-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-change-me}
      - GF_INSTALL_PLUGINS=${GF_INSTALL_PLUGINS:-}
    volumes:
      - grafana_data:/var/lib/grafana
    labels:
      platform: "omnia"
      app: "grafana"

volumes:
  grafana_data:
    driver: local
