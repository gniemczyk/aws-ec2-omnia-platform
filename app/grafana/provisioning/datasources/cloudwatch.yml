apiVersion: 1

datasources:
  - name: CloudWatch
    type: cloudwatch
    access: proxy
    uid: cloudwatch
    jsonData:
      authType: ec2IAMRole
      # Brak defaultRegion - region pochodzi z AWS_DEFAULT_REGION env var (ustawiany przez Ansible)
      # Dashboard jawnie podaje region w kazdym panelu przez template variable $region
      regions:
        - eu-central-1
        - eu-north-1
        - us-east-1
        - us-west-2

