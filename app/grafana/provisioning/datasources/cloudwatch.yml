apiVersion: 1

datasources:
  - name: CloudWatch
    type: cloudwatch
    access: proxy
    uid: cloudwatch
    jsonData:
      authType: ec2IAMRole
      defaultRegion: eu-central-1
      # Pozwól na popularne regiony, w tym te używane w projekcie
      regions:
        - eu-central-1
        - eu-north-1
        - us-east-1
        - us-west-2

